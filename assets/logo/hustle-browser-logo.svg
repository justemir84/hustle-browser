<?xml version="1.0" encoding="UTF-8"?>
<!-- Hustle Browser - Marka / Web Logosu -->
<!-- Kaynak: SVG (vektörel). İstenen boyutta PNG'ye dönüştürülebilir. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <linearGradient id="hustleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B00"/>
      <stop offset="60%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#8E24AA"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Arka plan (isteğe bağlı, şeffaf tutulabilir) -->
  <rect width="1200" height="400" fill="none"/>

  <!-- Sol: Simge -->
  <g transform="translate(60, 40)">
    <!-- Tarayıcı penceresi kutu -->
    <rect x="0" y="0" width="280" height="280" rx="48" fill="#1A1A1A" stroke="#333333" stroke-width="6"/>
    <!-- Tarayıcı adres çubuğu kısmı -->
    <rect x="20" y="30" width="240" height="44" rx="22" fill="#2A2A2A"/>
    <!-- Adres çubuğu noktaları -->
    <circle cx="44" cy="52" r="6" fill="#FF6B00"/>
    <circle cx="62" cy="52" r="4" fill="#666666"/>
    <circle cx="80" cy="52" r="4" fill="#666666"/>
    <!-- H harfi (büyük, ortada) -->
    <path d="M 70 130 L 70 230 L 100 230 L 100 180 L 130 180 L 130 230 L 160 230 L 160 130 Z" fill="url(#hustleGrad)" filter="url(#glow)"/>
    <!-- Tarayıcı sekme / hız çizgileri -->
    <path d="M 40 290 L 110 290 L 140 310 L 10 310 Z" fill="#FF6B00" opacity="0.9"/>
  </g>

  <!-- Sağ: Yazı -->
  <text x="380" y="220" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="150" letter-spacing="4" fill="#FFFFFF">HUSTLE</text>
  <text x="380" y="365" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="110" letter-spacing="2" fill="url(#hustleGrad)">BROWSER</text>
</svg>
